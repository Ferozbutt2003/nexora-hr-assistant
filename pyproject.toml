[project]
name = "rag-course"
version = "0.1.0"
description = "Nexora HR Assistant: a RAG chatbot over an employee handbook (LangChain, Pinecone, MiniMax, Streamlit)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=1.6.7",
    "langchain-pinecone>=0.2.13",
    "langchain-text-splitters>=1.1.3",
    "openai>=3.24.0",
    "pinecone>=7.3.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "streamlit>=1.65.0",
    "torch>=2.14.1",
]

# Use the CPU-only build of PyTorch: much smaller, and the cloud server has no GPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
